// ================================================
//   CS 1.6 - server.cfg
//   Shaxsiy server (do'st bilan IP/LAN o'yin)
//   Siz HOST bo'lganingizda yuklanadi.
//   Hamma sozlama ikkala o'yinchiga teng - halol.
// ================================================

// ---------- ASOSIY ----------
hostname "Avazbek Server"
sv_cheats "1"

// ---------- HARAKAT / TEZLIK ----------
sv_maxspeed "384"        // 20% tezroq (standart 320)
sv_accelerate "10"       // tezroq tezlanish
sv_gravity "640"         // balandroq sakrash (standart 800)
sv_friction "4"
sv_stopspeed "75"

// ---------- RAUND / PUL ----------
mp_freezetime "0"        // raund boshida kutish yo'q
mp_roundtime "9"         // uzun raund (daqiqa)
mp_startmoney "16000"    // to'liq pul
mp_buytime "9999"        // istalgan vaqt sotib olish
mp_c4timer "45"
mp_friendlyfire "0"      // o'zinikiga otilmaydi
mp_autoteambalance "0"   // 1v1 uchun balans o'chirilgan
mp_limitteams "0"

// ---------- O'YIN QULAYLIGI ----------
mp_flashlight "1"
mp_footsteps "1"
mp_tkpunish "0"
mp_timelimit "0"         // xarita vaqt chegarasi yo'q
decalfrequency "10"

// ---------- TARMOQ (silliq o'yin) ----------
sv_maxrate "25000"
sv_minrate "5000"
sys_ticrate "1000"

echo "=========================================="
echo "  Avazbek SERVER config yuklandi!"
echo "=========================================="
