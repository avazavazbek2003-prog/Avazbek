// ---------- CROSSHAIR (kichik, aniq) ----------
cl_crosshair_size "small"          // small / medium / large
cl_crosshair_color "0 255 0"       // yashil. Qizil: "255 0 0"
cl_crosshair_translucent "0"
cl_dynamiccrosshair "0"            // otganda yoyilmaydi - aniqroq

// ---------- SICHQONCHA / AIM ----------
sensitivity "1.5"                  // past = aniqroq (1.5 - 2.5 sinab ko'r)
m_rawinput "1"                     // sof sichqoncha aniqligi
m_filter "0"
zoom_sensitivity_ratio "1.0"

// ---------- GRAFIKA / KO'RINISH ----------
fps_max "144"
gl_vsync "0"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
brightness "2"
gamma "3"                          // yorqinroq - dushman yaxshi ko'rinadi
max_smokepuffs "0"                 // tutun kam - ravshanroq
r_detailtextures "1"
violence_ablood "1"
violence_hblood "1"

// ---------- TARMOQ (IP/LAN o'yin uchun silliq) ----------
rate "25000"
cl_cmdrate "101"
cl_updaterate "101"
ex_interp "0.01"

// ---------- QULAYLIK ----------
hud_fastswitch "1"                 // qurolni tez almashtirish
cl_righthand "1"
con_color "0 255 0"

echo "=========================================="
echo "  Avazbek config yuklandi! Omad, bro :)"
echo "=========================================="
